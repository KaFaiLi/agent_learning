[project]
name = "agent-learning"
version = "0.2.0"
description = "Claude-Code-style TUI agent demo with Azure OpenAI, hooks, MCP, skills, sub-agents, and Ralph loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"openai>=1.82.0",
	"pydantic>=2.11.4",
	"PyYAML>=6.0.2",
	"textual>=0.86.1",
]

[project.scripts]
agent-learning = "agent_learning.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
